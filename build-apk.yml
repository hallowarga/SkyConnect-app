name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Android
        run: |
          mkdir www
          cp index.html style.css app.js manifest.webmanifest sw.js logo.png mark.png icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init SkyConnect id.skyconnect.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SkyConnect-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
