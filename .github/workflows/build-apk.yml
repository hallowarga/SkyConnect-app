name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Android
        run: |
          mkdir www
          cp *.html *.css *.js *.png *.webmanifest www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init SkyConnect id.skyconnect.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Ganti ikon dengan logo SkyConnect
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
          done
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Siapkan file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SkyConnect.apk
      - name: Terbitkan APK (link publik)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SkyConnect APK
          files: SkyConnect.apk
          make_latest: true
